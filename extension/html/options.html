<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/options.css" />
</head>

<body>

    <div class="toggle">
        <span data-localise="__MSG_settingsToggle_NewTab_viewImage__">Open "View image" in a new tab:</span>
        <input type="checkbox" id="open-in-new-tab" />
        <label for="open-in-new-tab"></label>
    </div>

    <div class="toggle">
        <span data-localise="__MSG_settingsToggle_noReferrer__">Hide referrer from website when clicking "View Image":</span>
        <input type="checkbox" id="no-referrer" />
        <label for="no-referrer"></label>
    </div>

    <div class="toggle">
        <span data-localise="__MSG_settingsToggle_searchByImageButton__">Show "Search by image" button:</span>
        <input type="checkbox" id="show-search-by-image" />
        <label for="show-search-by-image"></label>
    </div>

    <div class="toggle">
        <span data-localise="__MSG_settingsToggle_buttonText__">Manually set button text:</span>
        <input type="checkbox" id="manually-set-button-text" />
        <label for="manually-set-button-text"></label>
    </div>

    <div class="textbox" id="manual-toggle">
        <div>
            <span data-localise="__MSG_viewImage__">View image</span>
            <input type="text" id="button-text-view-image" />
        </div>
        <div>
            <span data-localise="__MSG_searchImage__">Search by image</span>
            <input type="text" id="button-text-search-by-image" />
        </div>
    </div>

    <button type="button" id="reset-options" data-localise="__MSG_resetButton__">Reset</button>

    <script src="../js/defaults.js"></script>
    <script src="../js/options.js"></script>
    <script src="../js/localise.js"></script>
</body>

</html>
